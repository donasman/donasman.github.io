<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>정건희 쇼릴</title>
<!-- 15초 쇼릴의 원본. 그냥 열면 실시간으로 재생되고, render.py가 #render로 열어 프레임 단위로 찍는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #f8faf9; overflow: hidden; }
  #stage { display: block; width: 1920px; height: 1080px; }
  text { font-family: "Wanted Sans Variable", "Wanted Sans", sans-serif; }
  .mono { font-family: "JetBrains Mono", monospace; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W = 1920, H = 1080, FPS = 60, DUR = 15;
// 라이트는 사이트의 기본 색, 다크는 사이트 다크 모드의 색. 잉크 장면(FantaSteel)은 각 테마의 반대 색으로 뒤집는다.
const DARK = location.hash.includes('dark');
const C = DARK ? {
  paper: '#0f1513', surface: '#141b19', ink: '#e4eae7', muted: '#93a19b', rule: '#26302c', ruleD: '#34413c',
  jade: '#4cc89a', tint: '#15302a', cellDark: '#7e8c87', flash: '#2f6b56', dotGrid: '#1c2421',
  invBg: '#e9efec', dText: '#16202a', dMuted: '#5a6672', dRule: '#cfd8d5', dPanel: '#ffffff', panelStroke: '#c9d2cf',
  chipBg: '#f3f6f5', track: '#dce2e0', jadeB: '#0e7a5f', dotGridD: '#d6dedb', marksD: '#c9d2cf',
} : {
  paper: '#f8faf9', surface: '#ffffff', ink: '#16202a', muted: '#5a6672', rule: '#dce2e0', ruleD: '#c9d2cf',
  jade: '#0e7a5f', tint: '#e2f1eb', cellDark: '#3a4752', flash: '#9fd1bf', dotGrid: '#d6dedb',
  invBg: '#16202a', dText: '#e4eae7', dMuted: '#93a19b', dRule: '#33424d', dPanel: '#1e2b36', panelStroke: '#3a4955',
  chipBg: '#22303b', track: '#2b3843', jadeB: '#4cc89a', dotGridD: '#26333d', marksD: '#41505b',
};
document.body.style.background = C.paper;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('stage');

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  parent.appendChild(e);
  return e;
}
const g = (parent = svg, attrs = {}) => el('g', attrs, parent);
function T(parent, x, y, str, size, weight, fill, extra = {}) {
  return el('text', { x, y, 'font-size': size, 'font-weight': weight, fill, text: str, ...extra }, parent);
}
function spans(parent, x, y, parts, extra = {}) {
  const t = el('text', { x, y, ...extra }, parent);
  return [t, parts.map(([str, size, weight, fill, more = {}]) => el('tspan', { 'font-size': size, 'font-weight': weight, fill, text: str, ...more }, t))];
}
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const E = (name) => gsap.parseEase(name);
const prog = (t, a, b, ease = 'none') => E(ease)(clamp((t - a) / (b - a), 0, 1));
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const hooks = [];
const textAt = (node, schedule, styles) => hooks.push((t) => {
  let cur = schedule[0];
  for (const s of schedule) if (t >= s[0]) cur = s;
  if (node.textContent !== cur[1]) node.textContent = cur[1];
  if (styles && styles[cur[1]]) for (const [k, v] of Object.entries(styles[cur[1]])) node.setAttribute(k, v);
});

async function build() {
  await Promise.all([
    document.fonts.load('400 40px "Wanted Sans Variable"'), document.fonts.load('850 40px "Wanted Sans Variable"'),
    document.fonts.load('500 40px "JetBrains Mono"'), document.fonts.load('700 40px "JetBrains Mono"'),
  ]);
  await document.fonts.ready;

  const tl = gsap.timeline({ paused: true });
  const defs = el('defs');
  const dots = el('pattern', { id: 'dots', width: 40, height: 40, patternUnits: 'userSpaceOnUse' }, defs);
  el('circle', { cx: 20, cy: 20, r: 1.6, fill: C.dotGrid }, dots);
  const dotsD = el('pattern', { id: 'dotsD', width: 40, height: 40, patternUnits: 'userSpaceOnUse' }, defs);
  el('circle', { cx: 20, cy: 20, r: 1.6, fill: C.dotGridD }, dotsD);

  el('rect', { x: 0, y: 0, width: W, height: H, fill: C.paper });
  const grid = el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#dots)', opacity: 0 });
  tl.to(grid, { opacity: 1, duration: 0.4 }, 0);

  const s1 = g(), s2 = g(), s3 = g(), s5 = g(svg, { opacity: 0 });
  const flood = el('circle', { cx: 1590, cy: 592, r: 0, fill: C.invBg });
  const s4 = g(svg, { opacity: 0 }), s6 = g(), chrome = g();
  const fadeOut = el('rect', { x: 0, y: 0, width: W, height: H, fill: C.paper, opacity: 0 });

  /* ============ 1. 같은 요청 두 번, 결과는 한 번: 흩어진 행이 표로 맞물린다 ============ */
  const LS = { 'letter-spacing': -5 };
  const l1 = T(s1, 120, 410, '같은 요청이', 132, 820, C.ink, LS);
  const l2txt = '두 번 와도,';
  const probe = T(s1, 120, 560, l2txt, 132, 820, C.ink, LS);
  const xs = [...l2txt].map((_, i) => probe.getStartPositionOfChar(i).x - 120); // 커닝이 반영된 실제 위치
  probe.remove();
  const l2 = [...l2txt].map((ch, i) => (ch === ' ' ? null : T(s1, 120 + xs[i], 560, ch, 132, 820, C.ink))).filter(Boolean);
  const l3 = T(s1, 120, 710, '결과는 한 번만', 132, 820, C.jade, LS);
  const under = el('rect', { x: 120, y: 742, width: 0, height: 12, rx: 6, fill: C.jade }, s1);

  tl.fromTo(l1, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'expo.out' }, 0.1);
  l2.forEach((ch, i) => {
    const sx = (rnd() - 0.5) * 160, sy = (rnd() - 0.5) * 220, sr = (rnd() - 0.5) * 50;
    gsap.set(ch, { x: sx * 2.2, y: sy * 2.2, rotation: sr * 1.6, opacity: 0, transformOrigin: '50% 50%' });
    tl.to(ch, { x: sx, y: sy, rotation: sr, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.3 + i * 0.04);
    tl.to(ch, { x: 0, y: 0, rotation: 0, duration: 0.55, ease: 'expo.out' }, 1.02 + i * 0.03);
  });
  tl.fromTo(l3, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'expo.out' }, 1.42);
  tl.to(under, { attr: { width: l3.getComputedTextLength() }, duration: 0.5, ease: 'expo.out' }, 1.58);

  // 표: 12행 4열. 처음엔 흩어져 있다가 스캔선이 지나가는 순서대로 제자리에 맞물린다
  const tbl = { x0: 1060, y0: 290, rowH: 36, gap: 14, cols: [110, 240, 170, 150], cg: 16 };
  const colX = tbl.cols.map((_, c) => tbl.x0 + tbl.cols.slice(0, c).reduce((a, b) => a + b, 0) + c * tbl.cg);
  const cells = [];
  for (let r = 0; r < 12; r++) {
    for (let c = 0; c < 4; c++) {
      const fill = r === 0 ? C.ink : c === 0 ? C.jade : c === 1 ? C.cellDark : C.ruleD;
      const rect = el('rect', { x: colX[c], y: tbl.y0 + r * (tbl.rowH + tbl.gap), width: tbl.cols[c], height: tbl.rowH, rx: 7 }, s1);
      rect.style.fill = fill;
      const sx = (rnd() - 0.5) * 900, sy = (rnd() - 0.5) * 640, sr = (rnd() - 0.5) * 70;
      gsap.set(rect, { x: sx * 1.7, y: sy * 1.7, rotation: sr * 1.5, opacity: 0, transformOrigin: '50% 50%' });
      tl.to(rect, { x: sx, y: sy, rotation: sr, opacity: 1, duration: 0.7, ease: 'power3.out' }, 0.1 + rnd() * 0.4);
      const snapAt = 1.0 + ((colX[c] - 1040) / 760) * 0.45 + r * 0.008;
      tl.to(rect, { x: 0, y: 0, rotation: 0, duration: 0.5, ease: 'expo.out' }, snapAt);
      cells.push({ rect, r, c });
    }
  }
  const scan = el('rect', { x: 1030, y: 240, width: 4, height: 640, fill: C.jade, opacity: 0 }, s1);
  tl.fromTo(scan, { attr: { x: 1030 }, opacity: 0 }, { attr: { x: 1810 }, opacity: 1, duration: 0.5, ease: 'power2.inOut' }, 0.98);
  tl.to(scan, { opacity: 0, duration: 0.15 }, 1.45);

  // 1 → 2: 제목은 위로 빠지고, 표의 칸들이 진행 막대 두 줄로 재배치된다
  tl.to([l1, ...l2, l3, under], { y: '-=60', opacity: 0, duration: 0.35, ease: 'power2.in', stagger: 0.015 }, 2.0);
  const BX = 340, CG = 8, CW = (1800 - BX - 19 * CG) / 20, BY = [640, 760], BH = 64;
  const bars = [[], []];
  cells.forEach(({ rect }, i) => {
    if (i >= 40) {
      tl.to(rect, { opacity: 0, scale: 0.4, duration: 0.3, ease: 'power2.in' }, 2.05 + (i - 40) * 0.01);
      return;
    }
    const b = Math.floor(i / 20), k = i % 20;
    bars[b][k] = rect;
    tl.to(rect, { attr: { x: BX + k * (CW + CG), y: BY[b], width: CW, height: BH, rx: 9 }, fill: C.rule, duration: 0.55, ease: 'expo.inOut' }, 2.05 + i * 0.004);
  });

  /* ============ 2. 3,000만 건: 실패해도 저장 시점부터 ============ */
  const s2title = T(s2, 120, 190, '도시재생 종합정보체계', 60, 800, C.ink);
  const s2sub = T(s2, 120, 240, '실무, 공공 포털의 연간 데이터 갱신', 28, 500, C.muted);
  const [counter, cParts] = spans(s2, 120, 490, [['약 ', 64, 650, C.muted], ['0', 180, 850, C.ink], ['만 건', 72, 760, C.ink]]);
  const cSub = T(s2, 120, 552, '건축물대장 CSV, 매년 새로 갱신', 30, 500, C.muted);
  hooks.push((t) => { cParts[1].textContent = fmt(3000 * prog(t, 2.45, 3.3, 'power3.out')); });
  const lbl = [T(s2, 120, 672, '이전', 32, 750, C.ink), T(s2, 120, 792, '이후', 32, 750, C.ink)];
  const st = [T(s2, 120, 706, '', 22, 600, C.muted), T(s2, 120, 826, '', 22, 600, C.muted)];
  const stStyle = { '완료': { fill: C.jade }, '실패': { fill: C.ink }, '처리 중': { fill: C.muted }, '처음부터 다시': { fill: C.muted }, '저장 시점부터': { fill: C.jade } };
  textAt(st[0], [[0, ''], [2.8, '처리 중'], [3.3, '실패'], [3.55, '처음부터 다시'], [4.38, '완료']], stStyle);
  textAt(st[1], [[0, ''], [2.8, '처리 중'], [3.3, '실패'], [3.55, '저장 시점부터'], [4.01, '완료']], stStyle);
  const caption = T(s2, 120, 930, '멈춰도 처음부터 다시 돌리지 않습니다', 46, 800, C.jade);
  const ticks = [4, 9, 14, 19].map((k) => el('rect', { x: BX + k * (CW + CG) + CW / 2 - 2, y: 832, width: 4, height: 16, rx: 2, fill: C.ink, opacity: 0 }, s2));
  gsap.set([s2title, s2sub, counter, cSub, ...lbl, caption], { opacity: 0 });
  tl.to([s2title, s2sub], { opacity: 1, duration: 0.4, stagger: 0.06 }, 2.3);
  tl.fromTo(counter, { y: 40 }, { y: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, 2.4);
  tl.to([cSub, ...lbl], { opacity: 1, duration: 0.35, stagger: 0.05 }, 2.5);
  for (let k = 0; k < 12; k++) {
    for (const b of [0, 1]) tl.to(bars[b][k], { fill: C.jade, duration: 0.1 }, 2.8 + k * 0.04);
  }
  tl.to([bars[0][12], bars[1][12]], { fill: C.ink, duration: 0.08 }, 3.3);
  tl.to([...bars[0], ...bars[1]], { x: '+=12', duration: 0.04, yoyo: true, repeat: 5, ease: 'none' }, 3.3);
  tl.to(ticks[0], { opacity: 1, duration: 0.1 }, 2.8 + 4 * 0.04);
  tl.to(ticks[1], { opacity: 1, duration: 0.1 }, 2.8 + 9 * 0.04);
  tl.to(bars[0].slice(0, 13).reverse(), { fill: C.rule, duration: 0.08, stagger: 0.012 }, 3.55);
  tl.to(bars[1].slice(10, 13), { fill: C.rule, duration: 0.08 }, 3.55);
  tl.to(ticks[1], { fill: C.jade, duration: 0.1 }, 3.55);
  tl.fromTo(ticks[1], { scaleY: 1 }, { scaleY: 1.8, transformOrigin: '50% 0%', duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, 3.55);
  for (let k = 0; k < 20; k++) tl.to(bars[0][k], { fill: C.jade, duration: 0.08 }, 3.72 + k * 0.032);
  for (let k = 10; k < 20; k++) tl.to(bars[1][k], { fill: C.jade, duration: 0.08 }, 3.68 + (k - 10) * 0.032);
  tl.to(ticks[2], { opacity: 1, duration: 0.1 }, 3.68 + 4 * 0.032);
  tl.to(ticks[3], { opacity: 1, duration: 0.1 }, 3.68 + 9 * 0.032);
  tl.fromTo(caption, { y: 30 }, { y: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, 3.75);

  // 2 → 3: 완료된 '이후' 막대가 한 줄로 합쳐진 뒤 돌아서 경기장 하프라인이 된다
  tl.to([s2title, s2sub, counter, cSub, ...lbl, ...st, caption, ...ticks, ...bars[0]], { opacity: 0, duration: 0.25 }, 4.25);
  bars[1].forEach((rect, k) => {
    tl.to(rect, { attr: { x: BX + k * (1460 / 20), y: 789, width: 1460 / 20 + 0.8, height: 6, rx: 0 }, fill: C.jade, duration: 0.22, ease: 'power2.inOut' }, 4.28);
  });
  const pline = g(s3);
  const plineRect = el('rect', { x: -730, y: -3, width: 1460, height: 6, fill: C.jade }, pline);
  gsap.set(pline, { x: 1070, y: 792, opacity: 0, transformOrigin: '50% 50%' });
  tl.set(pline, { opacity: 1 }, 4.5);
  tl.set(bars[1], { opacity: 0 }, 4.5);
  tl.to(pline, { x: 960, y: 530, rotation: 90, duration: 0.42, ease: 'expo.inOut' }, 4.5);
  tl.to(plineRect, { attr: { x: -230, width: 460 }, duration: 0.42, ease: 'expo.inOut' }, 4.5);

  /* ============ 3. PitchLog League: 외부 API → 제한 → DB ============ */
  const pitch = g(s3);
  const nse = { 'vector-effect': 'non-scaling-stroke' };
  const pRect = el('rect', { x: 600, y: 300, width: 720, height: 460, rx: 22, fill: 'none', stroke: C.jade, 'stroke-width': 6, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, ...nse }, pitch);
  const pHalf = el('line', { x1: 960, y1: 300, x2: 960, y2: 760, stroke: C.jade, 'stroke-width': 6, opacity: 0, ...nse }, pitch);
  const pCircle = el('circle', { cx: 960, cy: 530, r: 86, fill: 'none', stroke: C.jade, 'stroke-width': 6, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, ...nse }, pitch);
  const pDot = el('circle', { cx: 960, cy: 530, r: 9, fill: C.jade, opacity: 0 }, pitch);
  const pBoxL = el('path', { d: 'M600 410H710V650H600', fill: 'none', stroke: C.jade, 'stroke-width': 6, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, ...nse }, pitch);
  const pBoxR = el('path', { d: 'M1320 410H1210V650H1320', fill: 'none', stroke: C.jade, 'stroke-width': 6, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, ...nse }, pitch);
  tl.set(pHalf, { opacity: 1 }, 4.92);
  tl.set(pline, { opacity: 0 }, 4.92);
  tl.to(pRect, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.inOut' }, 4.7);
  tl.to(pCircle, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.inOut' }, 4.82);
  tl.to([pBoxL, pBoxR], { strokeDashoffset: 0, duration: 0.35, ease: 'power2.inOut' }, 4.9);
  tl.to(pDot, { opacity: 1, duration: 0.1 }, 5.0);

  const s3title = T(s3, 120, 190, 'PitchLog League', 60, 800, C.ink);
  const s3sub = T(s3, 120, 240, '개인 프로젝트, 19개 대회 축구 데이터 서비스', 28, 500, C.muted);
  gsap.set([s3title, s3sub], { opacity: 0 });
  tl.to([s3title, s3sub], { opacity: 1, duration: 0.4, stagger: 0.06 }, 5.0);

  // 경기장을 줄여 왼쪽의 데이터 원천으로 보낸다
  tl.to(pitch, { scale: 0.36, x: 330 - 960, y: 600 - 530, svgOrigin: '960 530', duration: 0.55, ease: 'expo.inOut' }, 5.2);
  const srcLbl = T(s3, 330, 728, 'API-Football', 32, 750, C.ink, { 'text-anchor': 'middle', opacity: 0 });
  const srcSub = T(s3, 330, 766, '하루 7,500콜 한도', 24, 500, C.muted, { 'text-anchor': 'middle', opacity: 0 });
  const gate = g(s3, { opacity: 0 });
  el('rect', { x: 820, y: 540, width: 280, height: 120, rx: 14, fill: C.surface, stroke: C.ink, 'stroke-width': 3 }, gate);
  T(gate, 960, 592, 'API 클라이언트', 32, 750, C.ink, { 'text-anchor': 'middle' });
  T(gate, 960, 632, '분당 자체 상한', 24, 500, C.muted, { 'text-anchor': 'middle' });
  const db = g(s3, { opacity: 0 });
  el('rect', { x: 1430, y: 516, width: 320, height: 36, rx: 9, fill: C.jade }, db);
  const dbRows = [0, 1, 2, 3].map((i) => {
    const r = el('rect', { x: 1430, y: 562 + i * 30, width: 320, height: 22, rx: 6 }, db);
    r.style.fill = C.ruleD;
    return r;
  });
  T(db, 1590, 728, 'PostgreSQL', 32, 750, C.ink, { 'text-anchor': 'middle' });
  T(db, 1590, 766, '배치 upsert', 24, 500, C.muted, { 'text-anchor': 'middle' });
  const conn1 = el('line', { x1: 474, y1: 600, x2: 818, y2: 600, stroke: C.ruleD, 'stroke-width': 3, 'stroke-dasharray': '6 9', opacity: 0 }, s3);
  const conn2 = el('line', { x1: 1102, y1: 600, x2: 1428, y2: 600, stroke: C.ruleD, 'stroke-width': 3, 'stroke-dasharray': '6 9', opacity: 0 }, s3);
  tl.to([srcLbl, srcSub], { opacity: 1, duration: 0.3, stagger: 0.05 }, 5.5);
  tl.fromTo(gate, { scale: 0.9, opacity: 0, transformOrigin: '50% 50%' }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.6)' }, 5.45);
  tl.fromTo(db, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, 5.55);
  tl.to([conn1, conn2], { opacity: 1, duration: 0.3 }, 5.55);

  // 들어오는 요청은 몰려 오고, 클라이언트를 지난 요청은 일정한 간격으로 나간다
  const burst = [5.68, 5.72, 5.76, 5.8, 6.02, 6.06, 6.1, 6.36, 6.4, 6.44, 6.48, 6.72, 6.76, 6.8];
  const p1 = burst.map((t0) => ({ t0, dy: (rnd() - 0.5) * 22, c: el('circle', { r: 8, fill: C.jade, opacity: 0 }, s3) }));
  const p2 = Array.from({ length: 11 }, (_, i) => ({ t0: 5.9 + i * 0.11, c: el('circle', { r: 8, fill: C.jade, opacity: 0 }, s3) }));
  hooks.push((t) => {
    const vis = t < 7.15;
    for (const p of p1) {
      const k = (t - p.t0) / 0.42;
      const on = vis && k >= 0 && k <= 1;
      p.c.setAttribute('opacity', on ? (k > 0.85 ? (1 - k) / 0.15 : 1) : 0);
      if (on) { p.c.setAttribute('cx', 480 + 336 * E('power1.in')(k)); p.c.setAttribute('cy', 600 + p.dy * (1 - k)); }
    }
    for (const p of p2) {
      const k = (t - p.t0) / 0.5;
      const on = vis && k >= 0 && k <= 1;
      p.c.setAttribute('opacity', on ? (k < 0.1 ? k / 0.1 : 1) : 0);
      if (on) { p.c.setAttribute('cx', 1104 + 322 * k); p.c.setAttribute('cy', 600); }
    }
  });
  hooks.push((t) => {
    // 도착하는 순간 DB 행이 잠깐 밝아진다

  tl.fromTo(skBox, { x: -40 }, { x: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, 12.52);
  tl.fromTo(skRows, { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.018 }, 12.56);
  tl.fromTo(exBox, { x: 40 }, { x: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, 12.62);
  tl.fromTo(exRows, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: 'expo.out', stagger: 0.05 }, 12.66);
  tl.to(lines, { strokeDashoffset: 0, duration: 0.38, ease: 'power2.out', stagger: 0.02 }, 12.85);
  tl.to(nm, { opacity: 1, duration: 0.2 }, 13.25);
  tl.to(lines, { attr: { 'stroke-width': 4.4 }, opacity: 0.9, duration: 0.18, yoyo: true, repeat: 1, stagger: 0.008 }, 13.45);
  tl.to(map, { opacity: 0, scale: 0.96, svgOrigin: '960 540', duration: 0.35, ease: 'power2.in' }, 13.88);

  const endG = g(s6);
  const clip = (id, y, h) => {
    const cp = el('clipPath', { id }, defs);
    return el('rect', { x: 100, y, width: 0, height: h }, cp);
  };
  const c1 = clip('c1', 300, 240), c2 = clip('c2', 545, 80), c3 = clip('c3', 632, 64);
  T(endG, 120, 500, '정건희', 200, 850, C.ink, { 'clip-path': 'url(#c1)' });
  T(endG, 120, 598, '같은 요청이 두 번 와도, 결과는 한 번만 남기는 백엔드 개발자', 50, 680, C.ink, { 'clip-path': 'url(#c2)' });
  T(endG, 120, 676, 'donasman.github.io', 40, 500, C.jade, { class: 'mono', 'clip-path': 'url(#c3)' });
  const endBar = el('rect', { x: 120, y: 726, width: 0, height: 10, rx: 5, fill: C.jade }, endG);
  tl.to(c1, { attr: { width: 1700 }, duration: 0.55, ease: 'expo.out' }, 14.0);
  tl.to(c2, { attr: { width: 1700 }, duration: 0.55, ease: 'expo.out' }, 14.1);
  tl.to(c3, { attr: { width: 1700 }, duration: 0.55, ease: 'expo.out' }, 14.18);
  tl.to(endBar, { attr: { width: 520 }, duration: 0.5, ease: 'expo.out' }, 14.25);

  /* ============ 크롬: 이름, 주소, 진행 막대, 타임코드 ============ */
  const [brand, brandParts] = spans(chrome, 120, 100, [['정건희', 28, 800, C.ink], ['쇼릴 2026', 28, 500, C.muted, { dx: 14 }]]);
  const url = T(chrome, 1800, 100, 'donasman.github.io', 24, 500, C.muted, { class: 'mono', 'text-anchor': 'end' });
  const track = el('rect', { x: 120, y: 1012, width: 1680, height: 3, rx: 1.5, fill: C.rule }, chrome);
  const bar = el('rect', { x: 120, y: 1011, width: 0, height: 5, rx: 2.5, fill: C.jade }, chrome);
  const marks = [2.3, 4.7, 7.4, 10.3, 12.5].map((s) => el('rect', { x: 120 + (1680 * s) / DUR - 1, y: 1004, width: 2, height: 19, rx: 1, fill: C.ruleD }, chrome));
  const tc = T(chrome, 1800, 978, '00:00.00', 22, 500, C.muted, { class: 'mono', 'text-anchor': 'end' });
  const scene = T(chrome, 120, 978, '', 22, 500, C.muted, { class: 'mono' });
  textAt(scene, [[0, ''], [2.3, '실무'], [4.75, '개인 프로젝트'], [7.42, '팀 프로젝트'], [10.3, '팀 프로젝트'], [12.5, '']]);
  hooks.push((t) => {
    bar.setAttribute('width', (1680 * t) / DUR);
    const s = Math.floor(t), cs = Math.floor((t - s) * 100);
    tc.textContent = `00:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  });
  const darkOn = 7.32, darkOff = 10.42;
  const recolor = (at, toDark) => {
    tl.to([brandParts[0]], { fill: toDark ? C.dText : C.ink, duration: 0.15 }, at);
    tl.to([brandParts[1], url, tc, scene], { fill: toDark ? C.dMuted : C.muted, duration: 0.15 }, at);
    tl.to(track, { fill: toDark ? C.dRule : C.rule, duration: 0.15 }, at);
    tl.to(bar, { fill: toDark ? C.jadeB : C.jade, duration: 0.15 }, at);
    tl.to(marks, { fill: toDark ? C.marksD : C.ruleD, duration: 0.15 }, at);
  };
  recolor(darkOn, true);
  recolor(darkOff, false);
  tl.fromTo([brand, url], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.15);

  // 끝: 종이색으로 덮어 처음 프레임과 이어지게 한다
  tl.to(fadeOut, { opacity: 1, duration: 0.2, ease: 'none' }, DUR - 0.2);
  tl.set({}, {}, DUR);

  window.renderAt = (t) => { tl.seek(t, false); hooks.forEach((h) => h(t)); };
  window.reelDuration = DUR;
  window.reelFps = FPS;
  window.reelReady = true;

  if (!location.hash.startsWith('#render')) {
    let start = performance.now();
    const loop = (now) => { const t = ((now - start) / 1000) % DUR; window.renderAt(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
}
build();
</script>
